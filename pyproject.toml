[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag-platform"
version = "0.1.0"
description = "Enterprise RAG Knowledge and Document Intelligence Platform"
requires-python = ">=3.11"

dependencies = [
    "streamlit",
    "fastapi",
    "uvicorn",
    "langchain",
    "langchain-community",
    "langchain-text-splitters",
    "langchain-ollama",
    "chromadb",
    "sentence-transformers",
    "pypdf",
    "python-docx",
    "python-dotenv",
    "mcp>=2.3,<3",
    "langgraph>=1.2,<2"
 
]


[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "reportlab"
]


[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "data*", "configs*"]

